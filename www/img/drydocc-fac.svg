<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="100%" height="100%">
  <!-- Background Badge -->
  <rect width="32" height="32" rx="6" fill="#0b172a" />
  
  <!-- Outer Outline (Hard Hat & Body) -->
  <path d="
    M 12 4 h 8 v 1 h 2 v 1 h 1 v 2 h 1 v 3 h -1 v 1 h 1 v 1 h -1 v 1 h 2 v 2 h 1 v 8 h -1 v 2 h -2 v 1 h -2 v 1 h 4 v 2 h -6 v -1 h -7 v 1 h -6 v -2 h 4 v -1 h -2 v -1 h -2 v -2 h -1 v -8 h 1 v -2 h 2 v -1 h -1 v -1 h 1 v -1 h -1 v -3 h 1 v -2 h 1 v -1 h 2 v -1 z
  " fill="#050a12" />

  <!-- Hard Hat Base & Brim -->
  <path d="
    M 12 5 h 8 v 1 h 2 v 2 h -12 v -2 h 2 z
    M 10 8 h 12 v 3 h -12 z
    M 9 11 h 14 v 1 h -14 z
  " fill="#f6b800" />
  
  <!-- Hard Hat Highlight & Shading -->
  <path d="
    M 13 5 h 6 v 1 h -6 z
    M 11 8 h 3 v 3 h -3 z
    M 16 8 h 2 v 3 h -2 z
  " fill="#ffe066" />
  <path d="
    M 19 8 h 3 v 3 h -3 z
    M 9 11 h 14 v 1 h -14 z
  " fill="#c48a00" />

  <!-- Penguin Head / Face White -->
  <path d="
    M 11 12 h 10 v 1 h -10 z
    M 10 13 h 12 v 3 h -12 z
    M 11 16 h 10 v 1 h -10 z
    M 12 17 h 8 v 1 h -8 z
    M 13 18 h 6 v 1 h -6 z
    M 14 19 h 4 v 1 h -4 z
  " fill="#ffffff" />

  <!-- Black Feathers / Head Sides & Flippers -->
  <path d="
    M 9 12 h 2 v 1 h -2 z
    M 21 12 h 2 v 1 h -2 z
    M 8 13 h 2 v 3 h -2 z
    M 22 13 h 2 v 3 h -2 z
    M 7 16 h 2 v 2 h -2 z
    M 23 16 h 2 v 2 h -2 z
    M 6 18 h 2 v 4 h -2 z
    M 24 18 h 2 v 4 h -2 z
    M 7 22 h 2 v 2 h -2 z
    M 23 22 h 2 v 2 h -2 z
  " fill="#1b2430" />

  <!-- Eyes -->
  <rect x="12" y="14" width="2" height="2" fill="#0b1118" />
  <rect x="18" y="14" width="2" height="2" fill="#0b1118" />

  <!-- Orange Beak -->
  <path d="
    M 14 16 h 4 v 1 h -4 z
    M 15 17 h 2 v 1 h -2 z
  " fill="#fa5a00" />
  <rect x="15" y="16" width="2" height="1" fill="#ff8c38" />

  <!-- Hi-Vis Safety Vest (Orange) -->
  <path d="
    M 9 18 h 4 v 2 h -4 z
    M 19 18 h 4 v 2 h -4 z
    M 9 20 h 14 v 5 h -14 z
  " fill="#f85610" />

  <!-- Vest Reflective Silver Stripes -->
  <path d="
    M 11 18 h 2 v 2 h -2 z
    M 19 18 h 2 v 2 h -2 z
    M 9 21 h 14 v 1 h -14 z
    M 9 23 h 14 v 1 h -14 z
  " fill="#d9e2ec" />

  <!-- Vest Center Zipper Line -->
  <rect x="15" y="20" width="2" height="5" fill="#c43d00" />

  <!-- Feet (Orange Boots) -->
  <path d="
    M 9 27 h 5 v 2 h -5 z
    M 18 27 h 5 v 2 h -5 z
  " fill="#fa5a00" />
  <rect x="10" y="27" width="3" height="1" fill="#ff8c38" />
  <rect x="19" y="27" width="3" height="1" fill="#ff8c38" />
</svg>
